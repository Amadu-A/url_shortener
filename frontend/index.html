<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URL Shortener</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #667085;
      --line: #d8deea;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #0f766e;
      --danger: #b42318;
      --shadow: 0 16px 40px rgba(20, 32, 55, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 34px;
      line-height: 1.15;
    }

    .layout {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .panel {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    h2 {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.25;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 15px;
      color: var(--text);
      background: #fff;
    }

    input:focus {
      outline: 3px solid rgba(37, 99, 235, 0.18);
      border-color: var(--primary);
    }

    button {
      width: 100%;
      height: 44px;
      margin-top: 14px;
      border: 0;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      background: var(--primary);
      cursor: pointer;
    }

    button:hover {
      background: var(--primary-hover);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .result {
      min-height: 46px;
      margin-top: 16px;
      padding: 12px;
      border: 1px solid transparent;
      border-radius: 6px;
      line-height: 1.45;
      background: #f8fafc;
    }

    .result:empty {
      display: none;
    }

    .result.success {
      border-color: rgba(15, 118, 110, 0.28);
      color: var(--success);
      background: #f0fdfa;
    }

    .result.error {
      border-color: rgba(180, 35, 24, 0.28);
      color: var(--danger);
      background: #fff5f5;
    }

    a {
      color: inherit;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    @media (max-width: 760px) {
      main {
        padding: 28px 0;
      }

      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>URL Shortener</h1>

    <div class="layout">
      <section class="panel">
        <h2>Сократи ссылку</h2>
        <p>Введите длинный URL, получите короткую ссылку.</p>

        <form id="shorten-form">
          <label for="long-url">Длинный URL</label>
          <input id="long-url" name="long-url" type="url" placeholder="https://example.com/page" required>
          <button type="submit">Сократить</button>
        </form>

        <div id="shorten-result" class="result" aria-live="polite"></div>
      </section>

      <section class="panel">
        <h2>Статистика переходов</h2>
        <p>Введите сокращенную часть / slug, чтобы узнать статистику по переходам.</p>

        <form id="stats-form">
          <label for="slug">Slug</label>
          <input id="slug" name="slug" type="text" placeholder="sLuG11" required>
          <button type="submit">Получить статистику</button>
        </form>

        <div id="stats-result" class="result" aria-live="polite"></div>
      </section>
    </div>
  </main>

  <script>
    const apiBaseUrl = "";

    const shortenForm = document.querySelector("#shorten-form");
    const statsForm = document.querySelector("#stats-form");
    const shortenResult = document.querySelector("#shorten-result");
    const statsResult = document.querySelector("#stats-result");

    function showResult(element, message, type) {
      element.className = `result ${type}`;
      element.innerHTML = message;
    }

    function clearResult(element) {
      element.className = "result";
      element.textContent = "";
    }

    function setLoading(form, isLoading) {
      form.querySelector("button").disabled = isLoading;
    }

    shortenForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearResult(shortenResult);
      setLoading(shortenForm, true);

      const longUrl = document.querySelector("#long-url").value.trim();

      try {
        const response = await fetch(`${apiBaseUrl}/api/shorten`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ long_url: longUrl }),
        });

        const payload = await response.json();

        if (!response.ok) {
          throw new Error(payload.detail || "Не удалось сократить ссылку.");
        }

        const slug = payload.data;
        const shortUrl = `${window.location.origin}/r/${slug}`;

        showResult(
          shortenResult,
          `Короткая ссылка: <a href="${shortUrl}" target="_blank" rel="noreferrer">${shortUrl}</a><br>Slug: <strong>${slug}</strong>`,
          "success"
        );
      } catch (error) {
        showResult(shortenResult, error.message, "error");
      } finally {
        setLoading(shortenForm, false);
      }
    });

    statsForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearResult(statsResult);
      setLoading(statsForm, true);

      const slug = document.querySelector("#slug").value.trim().replace(/^\/+/, "");

      try {
        const response = await fetch(`${apiBaseUrl}/api/stats/${encodeURIComponent(slug)}`);
        const payload = await response.json();

        if (!response.ok) {
          throw new Error(payload.detail || "Не удалось получить статистику.");
        }

        showResult(
          statsResult,
          `Slug: <strong>${payload.short_id}</strong><br>Переходов: <strong>${payload.clicks}</strong>`,
          "success"
        );
      } catch (error) {
        showResult(statsResult, error.message, "error");
      } finally {
        setLoading(statsForm, false);
      }
    });
  </script>
</body>
</html>
